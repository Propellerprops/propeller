<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hero — Preview</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9F6;
  --ink:#1B1813;
  --mut:#8F8779;
  --line:#E5DECF;
  --yellow:#EDD216;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.nav{display:flex;align-items:center;gap:22px;padding:14px 34px;background:var(--paper);border-bottom:1px solid var(--line)}
.nav-logo-placeholder{font-family:'Fraunces',serif;font-weight:800;font-size:22px;letter-spacing:0.02em;color:var(--ink);cursor:pointer}
.nav-logo-sub{font-size:8px;letter-spacing:0.15em;color:var(--mut);display:block;margin-top:-2px}
.nav-link{font-family:'General Sans',sans-serif;font-weight:400;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink);padding:6px 0;margin-left:20px}
.nav-links{display:flex;gap:26px;flex:1;justify-content:center}
.nav-links span{font-family:'General Sans',sans-serif;font-weight:400;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink)}
.nav-right{display:flex;align-items:center;gap:16px;margin-left:auto}
.nav-div{width:1px;height:20px;background:var(--line)}
.nav-wl{font-family:'General Sans',sans-serif;font-weight:400;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px}
.wl-badge{background:var(--yellow);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}

.hero{position:relative;min-height:100vh;display:flex;align-items:center;background:#D9D9D9;overflow:hidden}
.hero-inner{position:relative;z-index:2;max-width:1380px;margin:0 auto;width:100%;padding:48px 44px}
.hero-copy{max-width:750px}
.hero-title{font-family:'Inter',sans-serif;font-weight:800;font-size:90px;line-height:1.0;color:var(--ink);letter-spacing:-0.015em;margin-bottom:24px}
.hero-sub{font-family:'General Sans',sans-serif;font-weight:400;font-size:20px;line-height:1.55;color:var(--ink);opacity:0.78;margin-bottom:24px;max-width:700px}
.hero-cta{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:16px 30px;font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;border-radius:3px}
</style>
</head>
<body>

<nav class="nav">
  <div>
    <div class="nav-logo-placeholder">PROPELLER</div>
    <span class="nav-logo-sub">PROPS &amp; COSTUMES</span>
  </div>
  <button class="nav-link">About Us</button>
  <div class="nav-links">
    <span>Costume</span>
    <span>Furniture</span>
  </div>
  <div class="nav-right">
    <span class="nav-div"></span>
    <div class="nav-wl">♡ Wishlist <span class="wl-badge">0</span></div>
  </div>
</nav>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-copy">
      <h1 class="hero-title">Spaces For<br>Storytelling.</h1>
      <p class="hero-sub">Furniture, props and costumes for film, photography and events.</p>
      <button class="hero-cta">Browse the collection →</button>
    </div>
  </div>
</header>

</body>
</html>
